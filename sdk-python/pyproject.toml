[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentroute"
version = "0.1.0"
description = "Python client for the AgentRoute policy gateway for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # standard library only

[tool.setuptools]
packages = ["agentroute"]

[tool.ruff]
line-length = 110
target-version = "py310"
