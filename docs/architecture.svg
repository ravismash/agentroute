<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Inline presentation attributes only (no CSS classes), so it renders reliably
       as an <img> on GitHub. Explicit light panel keeps it legible on dark themes. -->
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="559" rx="14" fill="none" stroke="#e2e8f0"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="28" y="34" font-size="18" font-weight="700" fill="#0f172a">AgentRoute — policy gateway for AI agents</text>
  <text x="28" y="54" font-size="11.5" fill="#475569">The agent proposes an action; a deterministic policy layer decides allow / approval_required / deny.</text>

  <!-- Agent -->
  <rect x="28" y="92" width="190" height="72" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="123" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SupportOps Agent</text>
  <text x="123" y="142" text-anchor="middle" font-size="11.5" fill="#475569">tools = proposals · SSE</text>

  <!-- Approval UI -->
  <rect x="28" y="404" width="190" height="72" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="123" y="434" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Approval UI</text>
  <text x="123" y="454" text-anchor="middle" font-size="11.5" fill="#475569">operator approve / reject</text>

  <!-- Gateway -->
  <rect x="330" y="228" width="200" height="104" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">gateway-api</text>
  <text x="430" y="282" text-anchor="middle" font-size="11.5" fill="#475569">authN · rate limit</text>
  <text x="430" y="300" text-anchor="middle" font-size="11.5" fill="#475569">context binding</text>
  <text x="430" y="318" text-anchor="middle" font-size="11.5" fill="#475569">one txn: action+decision+outbox</text>

  <!-- Policy engine -->
  <rect x="612" y="92" width="200" height="88" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="712" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">policy-engine</text>
  <text x="712" y="144" text-anchor="middle" font-size="11.5" fill="#475569">pure · default-deny</text>
  <text x="712" y="162" text-anchor="middle" font-size="11.5" fill="#475569">deny-overrides · fail-closed</text>

  <!-- Postgres -->
  <rect x="612" y="218" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="712" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Postgres</text>
  <text x="712" y="268" text-anchor="middle" font-size="11.5" fill="#475569">actions · decisions</text>
  <text x="712" y="286" text-anchor="middle" font-size="11.5" fill="#475569">outbox (source of truth)</text>

  <!-- Executor -->
  <rect x="330" y="404" width="200" height="88" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">executor</text>
  <text x="430" y="456" text-anchor="middle" font-size="11.5" fill="#475569">effectively-once</text>
  <text x="430" y="474" text-anchor="middle" font-size="11.5" fill="#475569">idempotency + reconcile</text>

  <!-- Stripe / CRM -->
  <rect x="612" y="412" width="200" height="72" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="712" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Stripe (test) · mock CRM</text>
  <text x="712" y="462" text-anchor="middle" font-size="11.5" fill="#475569">refunds · plan changes</text>

  <!-- Worker + streams -->
  <rect x="612" y="332" width="200" height="54" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="712" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Redis Streams → worker</text>
  <text x="712" y="374" text-anchor="middle" font-size="11.5" fill="#475569">audit · stats · DLQ · replay</text>

  <!-- Edges -->
  <path d="M218,140 C280,150 300,210 330,248" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="188" font-size="11" font-weight="600" fill="#334155">POST /v1/proposals</text>

  <path d="M330,238 C296,206 268,168 218,128" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="243" y="214" font-size="11" font-weight="600" fill="#047857">SSE status</text>

  <path d="M530,250 C566,220 580,168 612,146" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="548" y="196" font-size="11" font-weight="600" fill="#334155">evaluate()</text>

  <path d="M530,278 L612,268" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M430,332 L430,404" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="440" y="372" font-size="11" font-weight="600" fill="#334155">if allowed</text>

  <path d="M530,448 L612,448" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M218,434 C280,420 300,372 330,332" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="236" y="392" font-size="11" font-weight="600" fill="#334155">approve / reject</text>

  <path d="M712,308 L712,332" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="722" y="325" font-size="11" font-weight="600" fill="#334155">relay</text>

  <!-- legend -->
  <text x="28" y="516" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">DESIGN RULES</text>
  <text x="28" y="536" font-size="11.5" fill="#334155">1 · The LLM never decides — execution uses the stored, policy-approved proposal.   2 · Policy is default-deny, deny-overrides, fail-closed.</text>
  <text x="28" y="552" font-size="11.5" fill="#334155">3 · Args checked against server-side case data, not LLM claims.   4 · Money = integer minor units + ISO currency.   5 · Postgres outbox is the source of truth.</text>
</svg>
